<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Technical Round To-Do</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Technical Round To-Do</h1>
      <p class="subtitle">Track study progress across DSA, SQL, Python for data, stats, ML, projects, and A/B testing.</p>

      <div id="controls">
        <button id="reset">Reset Progress</button>
        <button id="export">Export Progress</button>
      </div>

      <div id="auth" class="auth">
        <input id="authEmail" type="email" placeholder="email@example.com" />
        <button id="signIn">Sign in with magic link</button>
        <button id="signOut" style="display:none">Sign out</button>
        <span id="userInfo"></span>
      </div>

      <div id="status" role="status"></div>
      <div id="overview">Overall progress: <span id="overall">0%</span></div>

      <div id="topics"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="env.js"></script>
    <script src="app.js"></script>
  </body>
</html>
